  <rect width="1600" height="970" fill="#07111f"/>
  <text x="54" y="58" class="title">Collision analysis architecture</text>
  <text x="54" y="88" class="subtitle">Bounded trust boundary → exact partitions → minimum witnesses</text>
  <line x1="54" y1="106" x2="1546" y2="106" stroke="#29425f"/>
  <rect x="54" y="126" width="468" height="74" rx="12" fill="#0e1b2d" stroke="#29425f"/>
  <rect x="54" y="126" width="5" height="74" rx="2" fill="#42d6c5"/>
  <text x="74" y="153" class="small">ALGORITHM</text>
  <text x="74" y="181" class="section">stage-partition-witness-v1</text>
  <rect x="538" y="126" width="310" height="74" rx="12" fill="#0e1b2d" stroke="#29425f"/>
  <rect x="538" y="126" width="5" height="74" rx="2" fill="#4db5ff"/>
  <text x="558" y="153" class="small">RECORDS / POLICIES</text>
  <text x="558" y="181" class="section">2,048 / 8</text>
  <rect x="864" y="126" width="330" height="74" rx="12" fill="#0e1b2d" stroke="#29425f"/>
  <rect x="864" y="126" width="5" height="74" rx="2" fill="#ffbd59"/>
  <text x="884" y="153" class="small">TRANSFORM APPLICATIONS</text>
  <text x="884" y="181" class="section">65,536</text>
  <rect x="1210" y="126" width="336" height="74" rx="12" fill="#0e1b2d" stroke="#29425f"/>
  <rect x="1210" y="126" width="5" height="74" rx="2" fill="#ff78a9"/>
  <text x="1230" y="153" class="small">WITNESS BUDGET</text>
  <text x="1230" y="181" class="section">20,480</text>
  <rect x="54" y="256" width="322" height="198" rx="16" fill="#0e1b2d" stroke="#42d6c5" stroke-width="2"/>
  <circle cx="84" cy="286" r="17" fill="#42d6c5"/>
  <text x="84" y="292" text-anchor="middle" font-size="15" font-weight="800" fill="#07111f">1</text>
  <text x="112" y="292" class="section">Explicit inputs</text>
  <text x="76" y="334" class="body">IdentifierRecord tuple</text>
  <text x="76" y="359" class="body">ordered TransformPolicy tuple</text>
  <text x="76" y="384" class="body">stable opaque record IDs</text>
  <text x="76" y="409" class="body">caller order is non-semantic</text>
  <rect x="430" y="256" width="322" height="198" rx="16" fill="#0e1b2d" stroke="#4db5ff" stroke-width="2"/>
  <circle cx="460" cy="286" r="17" fill="#4db5ff"/>
  <text x="460" y="292" text-anchor="middle" font-size="15" font-weight="800" fill="#07111f">2</text>
  <text x="488" y="292" class="section">Trust boundary</text>
  <text x="452" y="334" class="body">revalidate forged state</text>
  <text x="452" y="359" class="body">Unicode scalar checks</text>
  <text x="452" y="384" class="body">per-value + aggregate bounds</text>
  <text x="452" y="409" class="body">any rejection is atomic</text>
  <rect x="806" y="256" width="322" height="198" rx="16" fill="#0e1b2d" stroke="#ffbd59" stroke-width="2"/>
  <circle cx="836" cy="286" r="17" fill="#ffbd59"/>
  <text x="836" y="292" text-anchor="middle" font-size="15" font-weight="800" fill="#07111f">3</text>
  <text x="864" y="292" class="section">Canonical corpus</text>
  <text x="828" y="334" class="body">sort by record ID</text>
  <text x="828" y="359" class="body">preserve every occurrence</text>
  <text x="828" y="384" class="body">classify exact duplicates</text>
  <text x="828" y="409" class="body">hashes label, never decide equality</text>
  <rect x="1182" y="256" width="322" height="198" rx="16" fill="#0e1b2d" stroke="#ff78a9" stroke-width="2"/>
  <circle cx="1212" cy="286" r="17" fill="#ff78a9"/>
  <text x="1212" y="292" text-anchor="middle" font-size="15" font-weight="800" fill="#07111f">4</text>
  <text x="1240" y="292" class="section">Ordered evaluation</text>
  <text x="1204" y="334" class="body">run each policy stage</text>
  <text x="1204" y="359" class="body">track exact stage values</text>
  <text x="1204" y="384" class="body">partitions only coarsen</text>
  <text x="1204" y="409" class="body">enforce transformed-byte cap</text>
  <rect x="1182" y="582" width="322" height="198" rx="16" fill="#0e1b2d" stroke="#ff78a9" stroke-width="2"/>
  <circle cx="1212" cy="612" r="17" fill="#ff78a9"/>
  <text x="1212" y="618" text-anchor="middle" font-size="15" font-weight="800" fill="#07111f">5</text>
  <text x="1240" y="618" class="section">Policy witnesses</text>
  <text x="1204" y="660" class="body">detect first-merging buckets</text>
  <text x="1204" y="685" class="body">connect prior components</text>
  <text x="1204" y="710" class="body">store n − 1 edges per group</text>
  <text x="1204" y="735" class="body">no quadratic clique output</text>
  <rect x="806" y="582" width="322" height="198" rx="16" fill="#0e1b2d" stroke="#ffbd59" stroke-width="2"/>
  <circle cx="836" cy="612" r="17" fill="#ffbd59"/>
  <text x="836" y="618" text-anchor="middle" font-size="15" font-weight="800" fill="#07111f">6</text>
  <text x="864" y="618" class="section">Global union</text>
  <text x="828" y="660" class="body">union every policy relation</text>
  <text x="828" y="685" class="body">build risk neighborhoods</text>
  <text x="828" y="710" class="body">select a separate minimum tree</text>
  <text x="828" y="735" class="body">not one-policy equivalence</text>
  <rect x="430" y="582" width="322" height="198" rx="16" fill="#0e1b2d" stroke="#4db5ff" stroke-width="2"/>
  <circle cx="460" cy="612" r="17" fill="#4db5ff"/>
  <text x="460" y="618" text-anchor="middle" font-size="15" font-weight="800" fill="#07111f">7</text>
  <text x="488" y="618" class="section">CollisionGraph</text>
  <text x="452" y="660" class="body">immutable bounded result</text>
  <text x="452" y="685" class="body">groups + witness edges</text>
  <text x="452" y="710" class="body">components + isolated records</text>
  <text x="452" y="735" class="body">canonical deterministic IDs</text>
  <rect x="54" y="582" width="322" height="198" rx="16" fill="#0e1b2d" stroke="#42d6c5" stroke-width="2"/>
  <circle cx="84" cy="612" r="17" fill="#42d6c5"/>
  <text x="84" y="618" text-anchor="middle" font-size="15" font-weight="800" fill="#07111f">8</text>
  <text x="112" y="618" class="section">Current verification</text>
  <text x="76" y="660" class="body">public Python API probes</text>
  <text x="76" y="685" class="body">oracle + boundary tests</text>
  <text x="76" y="710" class="body">checked SVG evidence</text>
  <text x="76" y="735" class="body">documented security review</text>
