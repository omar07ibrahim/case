<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title description"><title id="title">Casefold Observatory report evidence architecture</title><desc id="description">Six-stage offline evidence flow from exact inputs to independently reviewed browser artifacts.</desc><rect width="1440" height="560" fill="#091015"/><text x="72" y="76" fill="#63e6d2" font-family="monospace" font-size="18" font-weight="700">VERIFIED OFFLINE REPORT / EVIDENCE FLOW</text><text x="72" y="122" fill="#edf5f1" font-family="sans-serif" font-size="34" font-weight="700">Real browser output, bound to exact bytes.</text><rect x="72" y="175" width="392" height="126" rx="18" fill="#111c21" stroke="#36505a"/><text x="96" y="210" fill="#f4c95d" font-family="monospace" font-size="14" font-weight="700">01</text><text x="96" y="245" fill="#edf5f1" font-family="sans-serif" font-size="22" font-weight="700">Exact inputs</text><text x="96" y="273" fill="#9fb4ad" font-family="monospace" font-size="13">stable source + canonical receipt</text><rect x="512" y="175" width="392" height="126" rx="18" fill="#111c21" stroke="#36505a"/><text x="536" y="210" fill="#f4c95d" font-family="monospace" font-size="14" font-weight="700">02</text><text x="536" y="245" fill="#edf5f1" font-family="sans-serif" font-size="22" font-weight="700">Installed wheel</text><text x="536" y="273" fill="#9fb4ad" font-family="monospace" font-size="13">analyze -> report -> verify</text><rect x="952" y="175" width="392" height="126" rx="18" fill="#111c21" stroke="#36505a"/><text x="976" y="210" fill="#f4c95d" font-family="monospace" font-size="14" font-weight="700">03</text><text x="976" y="245" fill="#edf5f1" font-family="sans-serif" font-size="22" font-weight="700">Safe publish</text><text x="976" y="273" fill="#9fb4ad" font-family="monospace" font-size="13">mode 0600 + no clobber</text><rect x="72" y="345" width="392" height="126" rx="18" fill="#111c21" stroke="#36505a"/><text x="96" y="380" fill="#f4c95d" font-family="monospace" font-size="14" font-weight="700">04</text><text x="96" y="415" fill="#edf5f1" font-family="sans-serif" font-size="22" font-weight="700">Offline Chromium</text><text x="96" y="443" fill="#9fb4ad" font-family="monospace" font-size="13">JS on + CSP + zero subresources</text><rect x="512" y="345" width="392" height="126" rx="18" fill="#111c21" stroke="#36505a"/><text x="536" y="380" fill="#f4c95d" font-family="monospace" font-size="14" font-weight="700">05</text><text x="536" y="415" fill="#edf5f1" font-family="sans-serif" font-size="22" font-weight="700">Real captures</text><text x="536" y="443" fill="#9fb4ad" font-family="monospace" font-size="13">desktop + mobile + full page + scroll</text><rect x="952" y="345" width="392" height="126" rx="18" fill="#111c21" stroke="#36505a"/><text x="976" y="380" fill="#f4c95d" font-family="monospace" font-size="14" font-weight="700">06</text><text x="976" y="415" fill="#edf5f1" font-family="sans-serif" font-size="22" font-weight="700">Independent gate</text><text x="976" y="443" fill="#9fb4ad" font-family="monospace" font-size="13">structure + hashes + human adoption</text><path d="M464 238H502M904 238H942M1268 301V345M942 408H904M502 408H464" stroke="#63e6d2" stroke-width="4" fill="none"/><text x="72" y="520" fill="#9fb4ad" font-family="monospace" font-size="14">No network during capture / synthetic data only / artifact adoption is a separate reviewed commit</text></svg>
