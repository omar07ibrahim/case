[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "casefold-observatory"
version = "0.4.0"
description = "Bounded, deterministic Unicode identifier collision analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Omar Ibrahim"}]
dependencies = []
keywords = ["unicode", "security", "identifiers", "collision-analysis"]

[project.scripts]
casefold-observatory = "casefold_observatory.cli:main"

[project.optional-dependencies]
dev = [
    "build==1.5.0",
    "coverage==7.15.2",
    "mypy==2.3.0",
    "ruff==0.16.0",
    "setuptools==83.0.0",
]

[project.urls]
Repository = "https://github.com/omar07ibrahim/case"
Issues = "https://github.com/omar07ibrahim/case/issues"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["casefold_observatory"]

[tool.setuptools.package-data]
casefold_observatory = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]

[tool.coverage.run]
branch = true
source = ["casefold_observatory"]

[tool.coverage.report]
fail_under = 100
precision = 2
show_missing = true
