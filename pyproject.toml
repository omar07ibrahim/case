[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "casefold-observatory"
version = "0.1.0"
description = "Bounded, explicit Unicode identifier transformation policies"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Omar Ibrahim"}]
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["casefold_observatory"]

[tool.setuptools.package-data]
casefold_observatory = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.coverage.run]
branch = true
source = ["casefold_observatory"]

[tool.coverage.report]
fail_under = 100
precision = 2
show_missing = true
