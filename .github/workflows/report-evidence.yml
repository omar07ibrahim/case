name: Report evidence

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: report-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-evidence:
    name: Offline Chromium evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CHECKOUT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      CONTAINER_IMAGE: mcr.microsoft.com/playwright/python@sha256:51d31fdfacb0cff99a1a724152e34ae408d2bd4e7da310ff157450f49261cc59
    steps:
      - name: Check out the explicit source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.CHECKOUT_REVISION }}

      - name: Assert detached source revision and tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CHECKOUT_REVISION"
          test "${#CHECKOUT_REVISION}" -eq 40
          case "$CHECKOUT_REVISION" in *[!0-9a-f]*) exit 1;; esac
          test -z "$(git symbolic-ref -q HEAD || true)"
          SOURCE_REVISION="$(git log -1 --format=%H -- \
            README.md \
            pyproject.toml \
            .github/workflows/report-evidence.yml \
            docs/report-evidence/fixtures/report-demo.v1.jsonl \
            requirements/report-browser.txt \
            requirements/report-browser-image.lock.json \
            scripts/render_report_evidence.py \
            scripts/verify_report_evidence.py \
            src/casefold_observatory)"
          test "${#SOURCE_REVISION}" -eq 40
          case "$SOURCE_REVISION" in *[!0-9a-f]*) exit 1;; esac
          SOURCE_TREE="$(git rev-parse "$SOURCE_REVISION^{tree}")"
          test "${#SOURCE_TREE}" -eq 40
          case "$SOURCE_TREE" in *[!0-9a-f]*) exit 1;; esac
          echo "SOURCE_REVISION=$SOURCE_REVISION" >>"$GITHUB_ENV"
          echo "SOURCE_TREE=$SOURCE_TREE" >>"$GITHUB_ENV"

      - name: Set up build Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/report-browser.txt

      - name: Install exact build tools
        run: |
          python -m pip install \
            build==1.5.0 \
            packaging==26.3 \
            pyproject-hooks==1.2.0 \
            setuptools==83.0.0

      - name: Build wheel from a clean archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/report-source" "$RUNNER_TEMP/report-wheel"
          git archive "$SOURCE_REVISION" | tar -x -C "$RUNNER_TEMP/report-source"
          (
            cd "$RUNNER_TEMP/report-source"
            SOURCE_DATE_EPOCH=315532800 \
              python -m build \
              --wheel \
              --no-isolation \
              --outdir "$RUNNER_TEMP/report-wheel"
          )
          wheels=("$RUNNER_TEMP"/report-wheel/*.whl)
          test "${#wheels[@]}" -eq 1

      - name: Download hash-locked evidence wheels
        run: |
          mkdir -p "$RUNNER_TEMP/report-wheelhouse"
          python -m pip download \
            --require-hashes \
            --only-binary=:all: \
            --dest "$RUNNER_TEMP/report-wheelhouse" \
            -r requirements/report-browser.txt
          test "$(find "$RUNNER_TEMP/report-wheelhouse" -maxdepth 1 -type f | wc -l)" -eq 5

      - name: Pull the platform-pinned browser image
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$CONTAINER_IMAGE"
          test "$(docker image inspect "$CONTAINER_IMAGE" --format '{{.Architecture}}/{{.Os}}')" = "amd64/linux"

      - name: Render and independently verify two isolated captures
        id: report_evidence
        shell: bash
        run: |
          set -euo pipefail
          candidates="$RUNNER_TEMP/report-evidence-candidates"
          mkdir -p "$candidates"
          for label in a b; do
            docker run --rm \
              --platform linux/amd64 \
              --pull=never \
              --network=none \
              --read-only \
              --cap-drop=ALL \
              --security-opt=no-new-privileges \
              --pids-limit=512 \
              --memory=4g \
              --cpus=2 \
              --shm-size=1g \
              --tmpfs /tmp:rw,exec,nosuid,nodev,size=2147483648 \
              --user "$(id -u):$(id -g)" \
              --env HOME=/tmp/home \
              --env PYTHONNOUSERSITE=1 \
              --env SOURCE_REVISION \
              --env SOURCE_TREE \
              --env CONTAINER_IMAGE \
              --env OUTPUT_ROOT="/out/$label" \
              --volume "$GITHUB_WORKSPACE:/src:ro" \
              --volume "$RUNNER_TEMP/report-wheel:/project-wheel:ro" \
              --volume "$RUNNER_TEMP/report-wheelhouse:/wheelhouse:ro" \
              --volume "$candidates:/out:rw" \
              --entrypoint bash \
              "$CONTAINER_IMAGE" \
              -euo pipefail -c '
                mkdir -p "$HOME" /tmp/evidence-python
                python -m pip install \
                  --no-index \
                  --find-links=/wheelhouse \
                  --target=/tmp/evidence-python \
                  /project-wheel/*.whl \
                  Pillow==12.3.0 \
                  playwright==1.62.0
                export PYTHONPATH=/tmp/evidence-python
                export EVIDENCE_SITE_ROOT=/tmp/evidence-python
                wheel=(/project-wheel/*.whl)
                python /src/scripts/render_report_evidence.py render \
                  --venv-bin "$(dirname "$(command -v python)")" \
                  --wheel "${wheel[0]}" \
                  --source-revision "$SOURCE_REVISION" \
                  --source-tree "$SOURCE_TREE" \
                  --container-image "$CONTAINER_IMAGE" \
                  --output-root "$OUTPUT_ROOT"
                python /src/scripts/verify_report_evidence.py verify \
                  "$OUTPUT_ROOT" \
                  --source-revision "$SOURCE_REVISION" \
                  --source-tree "$SOURCE_TREE" \
                  --wheel "${wheel[0]}"
              '
          done
          python scripts/verify_report_evidence.py compare \
            "$candidates/a" "$candidates/b"
          test "$(find "$candidates/a" -type f | wc -l)" -eq 8
          test -z "$(find "$candidates/a" -type l -print -quit)"
          test -z "$(git status --porcelain --untracked-files=all)"

          adopted="$RUNNER_TEMP/report-evidence-adopted"
          mkdir -p "$adopted"
          missing=false
          while IFS= read -r path; do
            if test ! -f "$path"; then
              missing=true
              continue
            fi
            mkdir -p "$adopted/$(dirname "$path")"
            cp "$path" "$adopted/$path"
            chmod 0600 "$adopted/$path"
          done <<'PATHS'
          docs/report-evidence/evidence/report-evidence.v1.json
          docs/report-evidence/evidence/report-demo.receipt.v1.json
          docs/report-evidence/evidence/report-demo.v1.html
          docs/report-evidence/report-desktop.png
          docs/report-evidence/report-mobile.png
          docs/report-evidence/report-full-page.png
          docs/report-evidence/report-scroll.gif
          docs/report-evidence/report-architecture.svg
          PATHS
          if test "$missing" = false && \
             python scripts/verify_report_evidence.py compare \
               "$candidates/a" "$adopted"; then
            echo "drift=false" >>"$GITHUB_OUTPUT"
          else
            echo "drift=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Preserve exact report evidence for review
        if: steps.report_evidence.outputs.drift == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-report-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/report-evidence-candidates/a/
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 1

      - name: Reject stale committed report evidence
        if: steps.report_evidence.outputs.drift == 'true'
        run: exit 1
