name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-package:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: python -m pip install .

      # Exact committed visual bytes bind UCD 15.0 and are replayed by the
      # Python 3.12 quality job. Other runtimes skip only the two UCD-bound
      # replay tests while retaining engine and static evidence checks.
      - name: Test installed package and portable evidence contracts
        run: python -m unittest discover -s tests -v

  quality:
    name: Quality and distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development tools
        run: |
          python -m pip install --require-hashes -r requirements/cli-visuals.txt
          python -m pip install -e ".[dev]"

      - name: Lint and type-check
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy src tests scripts

      - name: Test with branch coverage
        run: |
          python -m coverage erase
          python -m coverage run --branch -m unittest discover -s tests
          python -m coverage report -m

      - name: Verify generated visuals
        run: python scripts/render_collision_visuals.py --check

      - name: Verify source and wheel distributions
        run: python scripts/verify_distribution.py

  cli-evidence:
    name: Adopted CLI evidence
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out the explicit source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.SOURCE_REVISION }}

      - name: Assert source revision and tree
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          test "${#SOURCE_REVISION}" -eq 40
          case "$SOURCE_REVISION" in *[!0-9a-f]*) exit 1;; esac
          source_tree="$(git rev-parse HEAD^{tree})"
          test "$source_tree" = "$(git rev-parse "$SOURCE_REVISION^{tree}")"
          test "${#source_tree}" -eq 40
          case "$source_tree" in *[!0-9a-f]*) exit 1;; esac
          test -z "$(git symbolic-ref -q HEAD || true)"

      - name: Set up canonical evidence Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/cli-visuals.txt

      - name: Install hash-locked visual tooling
        run: |
          python -m pip install --require-hashes -r requirements/cli-visuals.txt
          python -m pip install \
            build==1.5.0 \
            packaging==26.3 \
            pyproject-hooks==1.2.0 \
            setuptools==83.0.0

      - name: Build and install the wheel outside the checkout
        run: |
          mkdir -p "$RUNNER_TEMP/cli-source" "$RUNNER_TEMP/cli-wheel"
          git archive "$SOURCE_REVISION" | tar -x -C "$RUNNER_TEMP/cli-source"
          (
            cd "$RUNNER_TEMP/cli-source"
            SOURCE_DATE_EPOCH=315532800 \
              python -m build \
              --wheel \
              --no-isolation \
              --outdir "$RUNNER_TEMP/cli-wheel"
          )
          wheels=("$RUNNER_TEMP"/cli-wheel/*.whl)
          test "${#wheels[@]}" -eq 1
          python -m venv "$RUNNER_TEMP/cli-venv"
          "$RUNNER_TEMP/cli-venv/bin/python" -m pip install \
            --no-index \
            --no-deps \
            "${wheels[0]}"

      - name: Reproduce and verify adopted CLI evidence
        run: |
          wheels=("$RUNNER_TEMP"/cli-wheel/*.whl)
          python scripts/render_cli_evidence.py check \
            --venv-bin "$RUNNER_TEMP/cli-venv/bin" \
            --wheel "${wheels[0]}"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
